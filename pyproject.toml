[project]
name = "creative-analytics"
version = "0.1.0"
description = "Analytics prototype around five video creatives"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=12",
    "duckdb>=1.0",
    "duckdb-cli>=1.0",
    "ipykernel>=6",
    "matplotlib>=3.8",
    "nbconvert>=7",
    "notebook>=7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creative_analytics"]
